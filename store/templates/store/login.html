<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopNow</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { background: white; border-radius: 24px; padding: 48px; width: 420px; margin: auto; box-shadow: 0 25px 60px rgba(0,0,0,0.4); }
        .brand { font-size: 28px; font-weight: 800; color: #1a1a2e; }
        .brand span { color: #ff6b35; }
        .form-control { border-radius: 10px; border: 1.5px solid #e2e8f0; padding: 12px 16px; }
        .btn-login { background: #ff6b35; border: none; border-radius: 10px; padding: 12px; width: 100%; color: white; font-weight: 600; }
        .btn-login:hover { background: #e55a2b; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand">Shop<span>Now</span></div>
        <p class="text-muted">Sign in to your account</p>
    </div>
    {% if form.errors %}
    <div class="alert alert-danger rounded-3">Invalid username or password.</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-login">Sign In</button>
    </form>
    <p class="text-center mt-4 text-muted">Don't have an account? <a href="{% url 'register' %}" style="color:#ff6b35;">Register</a></p>
</div>
</body>
</html>
